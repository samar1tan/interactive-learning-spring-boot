<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="An interactive Spring Boot learning gym for entry-level Java engineers who want hands-on practice and architecture judgment in the AI coding era."
    >
    <title>Spring Boot Architect Gym</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <noscript>
      <div class="noscript">
        This learning app needs JavaScript for drills, progress tracking, and prompt generation.
      </div>
    </noscript>

    <div class="app-shell">
      <header class="topbar">
        <div class="brand-lockup" aria-label="Spring Boot Architect Gym">
          <div class="brand-mark" aria-hidden="true">SB</div>
          <div>
            <p class="eyebrow">Interactive Spring Boot learning</p>
            <h1>Architect Gym</h1>
          </div>
        </div>

        <div class="topbar-actions">
          <label class="search-box">
            <span class="visually-hidden">Search lessons and dependencies</span>
            <input id="global-search" type="search" placeholder="Search boot, test, config...">
          </label>
          <button id="reset-progress" class="ghost-button" type="button">Reset</button>
          <button id="export-plan" class="primary-button" type="button">Copy Plan</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="side-rail" aria-label="Curriculum">
          <section class="rail-panel">
            <div class="progress-visual">
              <div id="progress-ring" class="progress-ring" aria-hidden="true">
                <span id="progress-number">0%</span>
              </div>
              <div>
                <p class="metric-label">Practice progress</p>
                <p id="progress-copy" class="metric-copy">0 of 0 checkpoints complete</p>
              </div>
            </div>
          </section>

          <section class="rail-panel compact">
            <div class="section-heading">
              <p class="eyebrow">Tracks</p>
              <h2>Rookie to architect</h2>
            </div>
            <div id="module-list" class="module-list"></div>
          </section>
        </aside>

        <section class="main-stage" aria-live="polite">
          <div class="stage-toolbar">
            <div class="segmented-control" role="tablist" aria-label="Learning views">
              <button class="tab-button active" type="button" data-view="learn" role="tab">Learn</button>
              <button class="tab-button" type="button" data-view="practice" role="tab">Practice</button>
              <button class="tab-button" type="button" data-view="radar" role="tab">Radar</button>
              <button class="tab-button" type="button" data-view="lab" role="tab">Lab</button>
            </div>
            <div class="version-note">
              Spring Boot docs checked 2026-05-24
            </div>
          </div>

          <div id="view-learn" class="view active"></div>
          <div id="view-practice" class="view"></div>
          <div id="view-radar" class="view"></div>
          <div id="view-lab" class="view"></div>
        </section>

        <aside class="coach-panel" aria-label="LLM coach">
          <section class="coach-card">
            <div class="section-heading">
              <p class="eyebrow">LLM help</p>
              <h2>Coach, not autopilot</h2>
            </div>
            <div class="mode-grid" role="group" aria-label="Coach mode">
              <button class="mode-button active" type="button" data-mode="socratic">Hint</button>
              <button class="mode-button" type="button" data-mode="review">Review</button>
              <button class="mode-button" type="button" data-mode="pair">Pair</button>
            </div>
            <textarea id="coach-prompt" readonly spellcheck="false" aria-label="Generated LLM prompt"></textarea>
            <div class="button-row">
              <button id="copy-prompt" class="primary-button" type="button">Copy Prompt</button>
              <button id="shuffle-drill" class="ghost-button" type="button">New Drill</button>
            </div>
            <p id="copy-status" class="copy-status" role="status"></p>
          </section>

          <section class="coach-card">
            <div class="section-heading">
              <p class="eyebrow">Current drill</p>
              <h2 id="coach-drill-title">Choose a module</h2>
            </div>
            <p id="coach-drill-copy" class="muted-copy"></p>
            <div class="timer-box">
              <span id="timer-display">15:00</span>
              <button id="start-timer" class="ghost-button" type="button">Start</button>
            </div>
          </section>
        </aside>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
